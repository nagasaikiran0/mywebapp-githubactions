on:
  push:
    branches:
      - master

  workflow_dispatch:

  permissions:
    contents: read
    pages: write
    id-token: write

jobs:
   deploy:
     runs-on: ubuntu-latest

     steps:
       -name: Checkout
        uses: actions/checkout@v4

     -name: upload Artifact
      uses: actions/upload-pages-artifact@v3
      with:
         path: .

      - name: Deploy
        uses: actions/depoly-pages@v4
